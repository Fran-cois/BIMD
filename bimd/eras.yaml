# Model release dates sourced from Epoch AI — Notable AI Models
# https://epoch.ai/data/notable-ai-models
eras:
  - id: pre_transformer
    name:
      en: "The Silent Era"
      fr: "L'Ère Silencieuse"
    start_date: "1900-01-01"
    end_date: "2017-06-11"
    top_models:
      - name: "Word2Vec"
        released: "2013-10-16"
        org: "Google"
      - name: "GloVe"
        released: "2014-01-01"
        org: "Stanford University"
      - name: "Seq2Seq LSTM"
        released: "2014-09-10"
        org: "Google"
    context_window:
      en: "A few words"
      fr: "Quelques mots"
    badge_label: "Pre-Attention Ancient"
    badge_color: "lightgrey"
    boomer_comments:
      en:
        - "Back in my day, we did NLP with regex and TF-IDF. We didn't politely ask a machine to code for us — we wrote our own transition matrices!"
        - "You want 'text generation'? Here's a Markov chain and a dictionary. Figure it out."
        - "We trained our models for weeks on a single GPU. And we were GRATEFUL."
        - "'Deep learning' meant stacking 3 LSTM layers and praying it converged before the end of the month."
      fr:
        - "À mon époque, on faisait du NLP avec des expressions régulières et du TF-IDF. On ne demandait pas poliment à une machine de coder à notre place, on codait nos propres matrices de transition !"
        - "Tu veux du 'text generation' ? Voilà une chaîne de Markov et un dictionnaire. Débrouille-toi."
        - "On entraînait nos modèles pendant des semaines sur un seul GPU. Et on était CONTENTS."
        - "Le 'deep learning' c'était empiler 3 couches LSTM et prier pour que ça converge avant la fin du mois."

  - id: transformer_birth
    name:
      en: "The Transformer Big Bang"
      fr: "Le Big Bang Transformer"
    start_date: "2017-06-12"
    end_date: "2018-10-10"
    top_models:
      - name: "Transformer"
        released: "2017-06-12"
        org: "Google Research / Google Brain"
      - name: "ELMo"
        released: "2018-02-01"
        org: "Allen Institute for AI"
    context_window: "512 tokens"
    badge_label: "Transformer Pioneer"
    badge_color: "yellow"
    boomer_comments:
      en:
        - "'Attention Is All You Need' they said. We needed attention, coffee, and a GPU cluster we didn't have."
        - "512 tokens of context. You could barely fit a paragraph. And we thought that was REVOLUTIONARY."
        - "We read papers on ArXiv wondering if it was genius or bullshit. Spoiler: it was both."
      fr:
        - "'Attention Is All You Need' qu'ils disaient. Nous, on avait besoin d'attention, de café, et d'un cluster de GPU qu'on n'avait pas."
        - "512 tokens de contexte. Tu pouvais à peine y mettre un paragraphe. Et on trouvait ça RÉVOLUTIONNAIRE."
        - "On lisait des papiers sur ArXiv en se demandant si c'était du génie ou du bullshit. Spoiler : c'était les deux."

  - id: bert_era
    name:
      en: "The BERT Age"
      fr: "L'Âge de BERT"
    start_date: "2018-10-11"
    end_date: "2020-06-10"
    top_models:
      - name: "BERT"
        released: "2018-10-11"
        org: "Google"
      - name: "GPT-2"
        released: "2019-02-14"
        org: "OpenAI"
      - name: "XLNet"
        released: "2019-06-01"
        org: "CMU / Google Brain"
      - name: "RoBERTa"
        released: "2019-07-01"
        org: "Facebook"
    context_window: "512 - 1024 tokens"
    badge_label: "BERT Veteran"
    badge_color: "orange"
    boomer_comments:
      en:
        - "BERT! The model that convinced managers AI could read. Spoiler: it could only guess the missing word."
        - "We fine-tuned BERT on a laptop with 8GB of RAM. OOM kills were our daily routine."
        - "GPT-2 was 'too dangerous to release'. Today you could run it on a toaster."
        - "Transfer learning was black magic. We downloaded pre-trained weights without understanding them and prayed."
      fr:
        - "BERT ! Le modèle qui a convaincu les managers que l'IA savait lire. Spoiler : il savait juste deviner le mot manquant."
        - "On fine-tunait BERT sur un laptop avec 8 Go de RAM. Les OOM kills étaient notre quotidien."
        - "GPT-2 était 'trop dangereux pour être publié'. Aujourd'hui on le ferait tourner sur un grille-pain."
        - "Le transfer learning c'était de la magie noire. On téléchargeait des poids pré-entraînés sans comprendre et on priait."

  - id: gpt3_dawn
    name:
      en: "The Dawn of Prompting"
      fr: "L'Aube du Prompt"
    start_date: "2020-06-11"
    end_date: "2022-11-29"
    top_models:
      - name: "GPT-3 175B"
        released: "2020-05-28"
        org: "OpenAI"
      - name: "DALL-E"
        released: "2021-01-05"
        org: "OpenAI"
      - name: "Codex"
        released: "2021-07-07"
        org: "OpenAI"
      - name: "PaLM 540B"
        released: "2022-04-04"
        org: "Google Research"
    context_window: "2048 - 4096 tokens"
    badge_label: "GPT-3 Prompt Whisperer"
    badge_color: "green"
    boomer_comments:
      en:
        - "Every API call to OpenAI cost a fortune. No chat, just raw completion. Miss your stop token and the model would loop forever, draining your bank account!"
        - "'Prompt engineering' was writing 'Translate the following text:' and hoping for the best. No system prompt, no roles, nothing."
        - "You wanted JSON output? You added 'Please respond in JSON' and crossed your fingers. Parsing the output was 80% of the job."
        - "Embeddings cost an arm and a leg. We computed cosine similarity by hand like craftsmen."
      fr:
        - "On payait la moindre requête une fortune sur l'API d'OpenAI. Pas de chat, juste de la complétion pure. Tu loupais ton stop token, et le modèle se mettait à boucler à l'infini en ruinant ton compte en banque !"
        - "Le 'prompt engineering' c'était écrire 'Translate the following text:' et espérer que ça marche. Pas de system prompt, pas de rôle, rien."
        - "Tu voulais du JSON en sortie ? Tu ajoutais 'Please respond in JSON' et tu croisais les doigts. Parser l'output, c'était 80% du boulot."
        - "Les embeddings coûtaient un bras. On calculait la similarité cosinus à la main comme des artisans."

  - id: chatgpt_explosion
    name:
      en: "The ChatGPT Big Bang"
      fr: "Le Grand Boom ChatGPT"
    start_date: "2022-11-30"
    end_date: "2023-03-13"
    top_models:
      - name: "ChatGPT (GPT-3.5)"
        released: "2022-11-30"
        org: "OpenAI"
      - name: "Flan-PaLM"
        released: "2022-10-20"
        org: "Google"
      - name: "LLaMA 65B"
        released: "2023-02-24"
        org: "Meta AI"
    context_window: "4096 tokens"
    badge_label: "ChatGPT Early Bird"
    badge_color: "brightgreen"
    boomer_comments:
      en:
        - "The day ChatGPT dropped, half of LinkedIn rebranded as 'AI Expert'. Overnight."
        - "4k tokens of context and we thought it was HUGE. We chunked our docs into 500-token pieces with 50-token overlap. PURE CRAFTSMANSHIP."
        - "Everyone wrapped the OpenAI API and called it a 'startup'. 500 lines of Python and an API key, valuation: $10 million."
        - "Hallucinations? We called them 'creative outputs' so we wouldn't scare the investors."
      fr:
        - "Le jour où ChatGPT est sorti, la moitié de LinkedIn s'est reconvertie en 'AI Expert'. Du jour au lendemain."
        - "4k tokens de contexte et on trouvait ça immense. On découpait nos documents en chunks de 500 tokens avec un overlap de 50. DE L'ARTISANAT."
        - "Tout le monde faisait des wrappers autour de l'API OpenAI et appelait ça une 'startup'. 500 lignes de Python et une clé API, valorisation : 10 millions."
        - "Les hallucinations ? On appelait ça des 'creative outputs' pour ne pas effrayer les investisseurs."

  - id: gpt4_revolution
    name:
      en: "The GPT-4 Revolution"
      fr: "La Révolution GPT-4"
    start_date: "2023-03-14"
    end_date: "2023-11-05"
    top_models:
      - name: "GPT-4"
        released: "2023-03-14"
        org: "OpenAI"
      - name: "Claude"
        released: "2023-03-14"
        org: "Anthropic"
      - name: "PaLM 2"
        released: "2023-05-10"
        org: "Google"
    context_window: "8k - 32k tokens"
    badge_label: "GPT-4 Early Adopter"
    badge_color: "blue"
    boomer_comments:
      en:
        - "Ah, the golden age of 3-week 'AI Engineers'! We spent our days writing 4-page prompts to force the model to spit out valid JSON."
        - "Context windows were so small we spent more time optimizing embeddings than writing actual code."
        - "LangChain had a new version every 3 days. Your code broke on Tuesday, you migrated on Wednesday, and it broke again on Thursday."
        - "We did RAG with Pinecone as if it were the solution to all of humanity's problems."
      fr:
        - "Ah, l'âge d'or des 'AI Engineers' de 3 semaines ! On passait nos journées à écrire des prompts de 4 pages pour forcer le modèle à cracher du JSON valide."
        - "Les fenêtres de contexte étaient si petites qu'on passait plus de temps à optimiser nos embeddings qu'à écrire du vrai code."
        - "LangChain avait une nouvelle version tous les 3 jours. Ton code cassait le mardi, tu migrais le mercredi, et ça recassait le jeudi."
        - "On faisait du RAG avec Pinecone comme si c'était la solution à tous les problèmes de l'humanité."

  - id: open_source_wave
    name:
      en: "The Open Source Wave"
      fr: "La Vague Open Source"
    start_date: "2023-11-06"
    end_date: "2024-03-03"
    top_models:
      - name: "Llama 2"
        released: "2023-07-18"
        org: "Meta AI"
      - name: "Claude 2.1"
        released: "2023-11-21"
        org: "Anthropic"
      - name: "GPT-4 Turbo"
        released: "2023-11-06"
        org: "OpenAI"
      - name: "Mixtral 8x7B"
        released: "2023-12-11"
        org: "Mistral AI"
    context_window: "128k tokens"
    badge_label: "Open Source Evangelist"
    badge_color: "blueviolet"
    boomer_comments:
      en:
        - "128k tokens of context! We felt rich. We dumped entire docs into the prompt like barbarians."
        - "Everyone fine-tuned Llama on garbage datasets and called it 'research'."
        - "We ran 7B models on our MacBooks and called it 'local AI'. It took 30 seconds per token."
        - "The Mixtral drama: when an open-source model was better than the commercial product and everyone pretended to be surprised."
      fr:
        - "128k tokens de contexte ! On se sentait riches. On balançait des docs entières dans le prompt comme des barbares."
        - "Tout le monde fine-tunait des Llama sur des datasets pourris en se disant que c'était de la recherche."
        - "On lançait des modèles 7B sur nos MacBooks et on appelait ça du 'local AI'. Ça prenait 30 secondes par token."
        - "Le drama Mixtral : quand un modèle open source était meilleur que le produit commercial et que tout le monde faisait semblant d'être surpris."

  - id: multimodal_era
    name:
      en: "The Multimodal Era"
      fr: "L'Ère Multimodale"
    start_date: "2024-03-04"
    end_date: "2024-09-11"
    top_models:
      - name: "Claude 3 Opus"
        released: "2024-03-04"
        org: "Anthropic"
      - name: "Llama 3 70B"
        released: "2024-04-18"
        org: "Meta AI"
      - name: "GPT-4o"
        released: "2024-05-13"
        org: "OpenAI"
      - name: "Gemini 1.5 Pro"
        released: "2024-02-15"
        org: "Google DeepMind"
    context_window: "200k - 1M tokens"
    badge_label: "Multimodal Native"
    badge_color: "ff69b4"
    boomer_comments:
      en:
        - "Models could finally read images! We all tested by sending pictures of our cats. Productivity: zero."
        - "1 million tokens of context at Gemini. You could finally send the entire codebase. The question is: why?"
        - "We had 3 sizes of Claude: Opus for work, Sonnet for everyday, Haiku for when you ran out of credits."
        - "'Vibe coding' was born here. Dumping your code and saying 'fix it' became a legitimate workflow."
      fr:
        - "Les modèles savaient enfin lire des images ! On a tous testé en leur envoyant des photos de notre chat. Productivité : zéro."
        - "1 million de tokens de contexte chez Gemini. On pouvait enfin envoyer tout le codebase. La question c'est : pourquoi ?"
        - "On avait 3 tailles de Claude : Opus pour le boulot, Sonnet pour tous les jours, Haiku pour quand on n'avait plus de crédits."
        - "Le 'vibe coding' est né ici. Balancer son code et dire 'corrige' était devenu un workflow légitime."

  - id: reasoning_age
    name:
      en: "The Age of Reasoning"
      fr: "L'Âge du Raisonnement"
    start_date: "2024-09-12"
    end_date: "2025-02-23"
    top_models:
      - name: "o1 / o1-mini"
        released: "2024-09-12"
        org: "OpenAI"
      - name: "Claude 3.5 Sonnet"
        released: "2024-06-20"
        org: "Anthropic"
      - name: "Llama 3.1 405B"
        released: "2024-07-23"
        org: "Meta AI"
      - name: "DeepSeek V3"
        released: "2024-12-26"
        org: "DeepSeek"
      - name: "Gemini 2.0 Pro"
        released: "2024-12-11"
        org: "Google DeepMind"
    context_window: "128k - 200k tokens"
    badge_label: "Chain-of-Thought Thinker"
    badge_color: "critical"
    boomer_comments:
      en:
        - "Models could 'think' now. Well, they pretended to by writing their reasoning out loud. Like my colleague Bernard."
        - "o1 took 45 seconds to answer but the answer was correct. We called that progress."
        - "DeepSeek shook Silicon Valley from China. AI geopolitics was better than Game of Thrones."
        - "You could finally send complex math to models without them inventing imaginary theorems. Well, almost."
      fr:
        - "Les modèles savaient 'réfléchir' maintenant. Enfin, ils faisaient semblant en écrivant leur raisonnement à voix haute. Comme mon collègue Bernard."
        - "o1 prenait 45 secondes pour répondre mais la réponse était correcte. On appelait ça du progrès."
        - "DeepSeek a fait trembler la Silicon Valley depuis la Chine. La géopolitique de l'IA, c'était mieux que Game of Thrones."
        - "On pouvait enfin envoyer des maths complexes aux modèles sans qu'ils inventent des théorèmes imaginaires. Enfin, presque."

  - id: agent_era
    name:
      en: "The Agentic Era"
      fr: "L'Ère Agentique"
    start_date: "2025-02-24"
    end_date: "2025-12-31"
    top_models:
      - name: "Claude 3.7 Sonnet"
        released: "2025-02-24"
        org: "Anthropic"
      - name: "GPT-4.5"
        released: "2025-02-27"
        org: "OpenAI"
      - name: "o3 / o4-mini"
        released: "2025-01-31"
        org: "OpenAI"
      - name: "Gemini 2.5 Pro"
        released: "2025-03-25"
        org: "Google DeepMind"
      - name: "Claude 4 Opus/Sonnet"
        released: "2025-05-22"
        org: "Anthropic"
      - name: "Llama 4 Scout"
        released: "2025-04-05"
        org: "Meta AI"
    context_window: "200k - 1M+ tokens"
    badge_label: "Agent Orchestrator"
    badge_color: "9cf"
    boomer_comments:
      en:
        - "Agents! We let AIs talk to each other while we watch. That's management, not development."
        - "Context is so large we don't know what to put in it. We solved the size problem by creating the noise problem."
        - "MCP, function calling, tool use... We reinvented microservices but with hallucinations as a bonus."
        - "Claude codes, Copilot codes, Cursor codes... soon developers won't code anymore. Oh wait."
        - "Vibe coding 2.0: now the agent vibe-codes for you while you sip your coffee."
      fr:
        - "Les agents ! On laisse les IA se parler entre elles pendant qu'on regarde. C'est du management, pas du développement."
        - "Le contexte est si grand qu'on ne sait plus quoi mettre dedans. On a résolu le problème de la taille en créant le problème du bruit."
        - "MCP, function calling, tool use... On a réinventé les microservices mais avec des hallucinations en bonus."
        - "Claude code, Copilot code, Cursor code... bientôt les développeurs ne coderont plus. Ah wait."
        - "Vibe coding 2.0 : maintenant c'est l'agent qui vibe-code pour toi pendant que tu sirotes ton café."

  - id: future_unknown
    name: "Terra Incognita"
    start_date: "2026-01-01"
    end_date: "2099-12-31"
    top_models:
      - name: "???"
    context_window:
      en: "∞ ?"
      fr: "∞ ?"
    badge_label: "Time Traveler"
    badge_color: "black"
    boomer_comments:
      en:
        - "You're from the future? Have models finally stopped hallucinating? No? I figured."
        - "If you're reading this, AI hasn't replaced developers yet. Or it's using bimd to understand its human ancestors' code."
        - "The future is unknown, but one thing's for sure: someone still wrote a wrapper around an API and called it a 'platform'."
      fr:
        - "Tu viens du futur ? Est-ce que les modèles ont enfin arrêté d'halluciner ? Non ? Je m'en doutais."
        - "Si tu lis ça, c'est que l'IA n'a pas encore remplacé les développeurs. Ou alors elle utilise bimd pour comprendre le code de ses ancêtres humains."
        - "Le futur est inconnu, mais une chose est sûre : quelqu'un a encore écrit un wrapper autour d'une API et l'a appelé une 'plateforme'."
