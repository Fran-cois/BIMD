[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backinmyday"
version = "0.1.0"
description = "CLI archaeology tool for the AI era — discover what the LLM landscape looked like when your code was written."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Fran-cois" },
]
keywords = ["cli", "llm", "git", "archaeology", "ai", "history"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bimd = "bimd.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["bimd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
